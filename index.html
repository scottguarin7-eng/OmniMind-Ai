<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neural Ultra Test</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: white;
      background: #080b18;
      font-family: Arial, sans-serif;
    }

    .card {
      width: min(500px, calc(100% - 32px));
      padding: 28px;
      text-align: center;
      border: 1px solid #34416b;
      border-radius: 24px;
      background: #141b32;
      box-shadow: 0 20px 60px #0008;
    }

    h1 {
      margin-top: 0;
      color: #65f3ff;
    }

    p {
      color: #aab5d1;
      line-height: 1.6;
    }

    button {
      margin: 6px;
      padding: 12px 16px;
      border: 0;
      border-radius: 12px;
      color: #061016;
      background: #65f3ff;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: white;
    }

    #result {
      min-height: 26px;
      margin-top: 20px;
      color: #79f2b0;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Neural Ultra</h1>

    <p>
      Simple button test. Wala munang Gemini at walang features.
    </p>

    <button id="helloButton" type="button">Test Button</button>
    <button id="clearButton" type="button">Clear</button>

    <div id="result">Wala pang pinipindot.</div>
  </main>

  <script>
    document.getElementById("helloButton").onclick = function () {
      document.getElementById("result").textContent =
        "Gumagana ang button.";
    };

    document.getElementById("clearButton").onclick = function () {
      document.getElementById("result").textContent =
        "Wala pang pinipindot.";
    };
  </script>
</body>
</html>
