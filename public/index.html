<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080d19">
  <meta name="description" content="OmniMind AI — a focused workspace for questions, ideas, and problem solving.">
  <title>OmniMind AI — Neural Engine</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <!-- Top Navigation -->
    <header class="top-nav">
      <div class="menu-icon">☰</div>
      <div class="nav-title">OmniMind AI <span>v1.0</span></div>
      <div class="profile-icon">S</div>
    </header>

    <main>
      <!-- Welcome / Hero Section -->
      <div class="welcome" id="welcome">
        <div class="hero-logo">◈</div>
        <h1 class="greeting">What can I help with, Scott?</h1>
        
        <div class="suggestions-list" id="suggestions">
          <button data-prompt="Explain a complex idea in simple terms.">
            <span class="icon">✧</span> Explain a complex idea
          </button>
          <button data-prompt="Help me solve a math problem step by step.">
            <span class="icon">∑</span> Work through a math problem
          </button>
          <button data-prompt="Help me brainstorm a project idea and make an action plan.">
            <span class="icon">✦</span> Brainstorm a project idea
          </button>
          <button data-prompt="Help me write and explain a small Python program.">
            <span class="icon">{ }</span> Write and explain code
          </button>
        </div>
      </div>

      <!-- Chat Messages Container (hidden until chat starts) -->
      <div class="messages" id="messages" aria-live="polite"></div>
      
      <!-- Scroll to Bottom space -->
      <div class="spacer"></div>
    </main>

    <!-- Bottom Floating Input Area -->
    <footer class="composer-wrap">
      <div class="tools">
        <div class="grounding"><span>◎</span> Google Search</div>
        <div class="thinking-level">
          <select id="thinking-level" disabled>
            <option value="soon" selected>Thinking: Soon...</option>
          </select>
        </div>
        <button id="clear">Clear</button>
      </div>
      
      <form id="form" class="floating-input">
        <button type="button" class="plus-btn">+</button>
        <textarea id="prompt" rows="1" maxlength="10000" placeholder="Message OmniMind AI…"></textarea>
        <button id="send" type="submit">Send</button>
      </form>
      <p class="hint">OmniMind AI can make mistakes. Check important information.</p>
    </footer>

    <footer class="bottom-status">
      <span>◈ OmniMind AI</span>
      <span id="status">Checking provider…</span>
      <button id="about">About</button>
    </footer>
  </div>

  <dialog id="about-dialog"><button class="close" id="close-about">×</button><p class="eyebrow">ABOUT THIS WORKSPACE</p><h2>OmniMind AI</h2><p>OmniMind Neural Engine is the product experience for this workspace.</p><button class="okay" id="okay">Got it</button></dialog>
  <div class="toast" id="toast" role="status"></div>
  <script src="/app.js" defer></script>
</body>
</html>
