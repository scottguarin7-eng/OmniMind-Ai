<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080d19">
  <title>OmniMind AI — Neural Engine</title>
  <style>
    :root { --bg: #080d19; --bg-card: #131b2e; --text: #e2e8f0; --text-muted: #94a3b8; --accent: #22d3ee; --accent-glow: rgba(34, 211, 238, 0.4); --border: #1e293b; --user-msg: #1e3a8a; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .shell { display: flex; flex-direction: column; height: 100%; width: 100%; max-width: 900px; margin: 0 auto; position: relative; }
    .top-nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; font-size: 14px; color: var(--text-muted); }
    .nav-title span { font-size: 10px; background: var(--border); padding: 2px 6px; border-radius: 4px; color: var(--accent); }
    .profile-icon { width: 28px; height: 28px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; font-size: 12px; }
    main { flex: 1; display: flex; flex-direction: column; position: relative; overflow-y: auto; padding: 0 20px; scroll-behavior: smooth; }
    .welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-bottom: 10vh; }
    .hero-logo { font-size: 60px; margin-bottom: 20px; color: var(--accent); filter: drop-shadow(0 0 20px var(--accent-glow)); }
    .greeting { font-size: 32px; font-weight: 500; color: var(--text); margin-bottom: 40px; letter-spacing: -0.5px; }
    .suggestions-list { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 600px; }
    .suggestions-list button { background: transparent; border: 1px solid transparent; color: var(--text); padding: 16px; border-radius: 12px; text-align: left; display: flex; align-items: center; gap: 16px; font-size: 15px; cursor: pointer; }
    .suggestions-list button:hover { background: var(--bg-card); border-color: var(--border); }
    .suggestions-list .icon { color: var(--accent); }
    .messages { display: flex; flex-direction: column; gap: 20px; padding: 20px 0; padding-bottom: 120px; }
    .message { display: flex; flex-direction: column; max-width: 85%; }
    .message.user { align-self: flex-end; align-items: flex-end; }
    .message.model { align-self: flex-start; align-items: flex-start; }
    .message-content { background: var(--bg-card); padding: 16px; border-radius: 16px; font-size: 15px; line-height: 1.5; border: 1px solid var(--border); white-space: pre-wrap; }
    .message.user .message-content { background: var(--user-msg); border-color: var(--border); }
    .composer-wrap { position: absolute; bottom: 0; left: 0; right: 0; padding: 0 20px 20px; background: linear-gradient(to top, var(--bg) 70%, transparent); }
    .tools { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-muted); margin-bottom: 10px; padding: 0 10px; }
    .floating-input { display: flex; align-items: center; background: var(--bg-card); border: 1px solid var(--border); border-radius: 30px; padding: 8px 16px; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .floating-input:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
    .plus-btn { background: transparent; border: none; color: var(--text); font-size: 24px; cursor: pointer; padding-bottom: 4px; }
    .floating-input textarea { flex: 1; background: transparent; border: none; color: var(--text); resize: none; outline: none; font-size: 16px; padding: 10px 0; max-height: 150px; }
    .floating-input button#send { background: var(--accent); color: #000; border: none; border-radius: 20px; padding: 10px 20px; font-weight: 600; cursor: pointer; }
    .hint { text-align: center; font-size: 10px; color: var(--text-muted); margin-top: 12px; }
    .thinking-badge { display: flex; align-items: center; gap: 6px; background: linear-gradient(90deg, rgba(34, 211, 238, 0.1), rgba(34, 211, 238, 0.05)); border: 1px solid rgba(34, 211, 238, 0.3); color: var(--accent); padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 500; }
    .thinking-badge .lock { font-size: 10px; opacity: 0.8; }
    .thinking-badge strong { color: #fff; }
    .dual-response-container { display: flex; flex-direction: column; gap: 12px; width: 100%; }
    @media (min-width: 768px) { .dual-response-container { flex-direction: row; } .dual-response-container .message-content { flex: 1; } }
    .analyst-card { border-left: 3px solid #3b82f6; }
    .visionary-card { border-left: 3px solid #a855f7; }
    .card-title { font-size: 12px; font-weight: bold; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .analyst-card .card-title { color: #3b82f6; }
    .visionary-card .card-title { color: #a855f7; }
    .typing-indicator .message-content { display: flex; align-items: center; gap: 5px; padding: 16px 20px; width: fit-content; }
    .typing-dot { width: 8px; height: 8px; background-color: var(--accent); border-radius: 50%; animation: bounceGlow 1.4s infinite ease-in-out both; }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounceGlow { 0%, 80%, 100% { transform: scale(0); opacity: 0.3; box-shadow: none; } 40% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 10px var(--accent-glow); } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top-nav">
      <div class="menu-icon">☰</div>
      <div class="nav-title">OmniMind AI <span>v1.0</span></div>
      <div class="profile-icon">S</div>
    </header>
    <main>
      <div class="welcome" id="welcome">
        <div class="hero-logo">◈</div>
        <h1 class="greeting">What can I help with, Scott?</h1>
        <div class="suggestions-list" id="suggestions">
          <button data-prompt="Explain a complex idea in simple terms."><span class="icon">✧</span> Explain a complex idea</button>
          <button data-prompt="Help me solve a math problem step by step."><span class="icon">∑</span> Work through a math problem</button>
          <button data-prompt="Help me brainstorm a project idea and make an action plan."><span class="icon">✦</span> Brainstorm a project idea</button>
          <button data-prompt="Help me write and explain a small Python program."><span class="icon">{ }</span> Write and explain code</button>
        </div>
      </div>
      <div class="messages" id="messages" aria-live="polite"></div>
    </main>
    <footer class="composer-wrap">
      <div class="tools">
        <div class="grounding"><span>◎</span> Google Search</div>
        <div class="thinking-badge">
          <span class="lock">🔒</span> Thinking: <strong>Soon</strong>
        </div>
        <button id="clear" style="background:none; border:none; color:var(--text-muted); cursor:pointer;">Clear</button>
      </div>
      <form id="form" class="floating-input">
        <button type="button" class="plus-btn">+</button>
        <textarea id="prompt" rows="1" maxlength="10000" placeholder="Message OmniMind AI…"></textarea>
        <button id="send" type="submit">Send</button>
      </form>
      <p class="hint">OmniMind AI can make mistakes. Check important information.</p>
    </footer>
  </div>
  <script>
    const form = document.getElementById('form');
    const promptInput = document.getElementById('prompt');
    const messagesContainer = document.getElementById('messages');
    const welcomeScreen = document.getElementById('welcome');
    const sendBtn = document.getElementById('send');
    const clearBtn = document.getElementById('clear');
    const suggestions = document.getElementById('suggestions');
    let history = [];
    let isGenerating = false;
    async function typeWriter(element, text, speed = 10) {
      let i = 0;
      return new Promise(resolve => {
        const interval = setInterval(() => {
          element.textContent += text.charAt(i);
          i++;
          messagesContainer.scrollTop = messagesContainer.scrollHeight;
          if (i >= text.length) { clearInterval(interval); resolve(); }
        }, speed);
      });
    }
    function addUserMessage(text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message user`;
      msgDiv.innerHTML = `<div class="message-content">${text}</div>`;
      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
    async function addDualAIMessage(analystText, visionaryText) {
      const container = document.createElement('div');
      container.className = 'message model';
      container.innerHTML = `
        <div class="dual-response-container">
          <div class="message-content analyst-card"><div class="card-title">🔵 The Analyst</div><div class="text-content" id="analyst-text"></div></div>
          <div class="message-content visionary-card"><div class="card-title">🟣 The Visionary</div><div class="text-content" id="visionary-text"></div></div>
        </div>`;
      messagesContainer.appendChild(container);
      const analystEl = container.querySelector('#analyst-text');
      const visionaryEl = container.querySelector('#visionary-text');
      await Promise.all([ typeWriter(analystEl, analystText, 10), typeWriter(visionaryEl, visionaryText, 10) ]);
    }
    function showTyping() {
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message model typing-indicator';
      typingDiv.id = 'typing';
      typingDiv.innerHTML = `<div class="message-content"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
      messagesContainer.appendChild(typingDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
    function removeTyping() {
      const typing = document.getElementById('typing');
      if (typing) typing.remove();
    }
    async function handleSubmit(e) {
      e.preventDefault();
      const text = promptInput.value.trim();
      if (!text || isGenerating) return;
      if (welcomeScreen) welcomeScreen.style.display = 'none';
      addUserMessage(text);
      history.push({ role: 'user', text: text });
      promptInput.value = '';
      promptInput.style.height = 'auto';
      isGenerating = true;
      sendBtn.disabled = true;
      showTyping(); 
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 25000); 
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history }),
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        const data = await response.json();
        removeTyping();
        if (!response.ok) throw new Error(data.error || 'Failed');
        await addDualAIMessage(data.analyst, data.visionary); 
        history.push({ role: 'model', text: `Analyst: ${data.analyst}\nVisionary: ${data.visionary}` });
      } catch (error) {
        clearTimeout(timeoutId);
        removeTyping();
        const errDiv = document.createElement('div');
        errDiv.className = 'message model';
        errDiv.innerHTML = `<div class="message-content">Error: ${error.name === 'AbortError' ? 'Timeout. Pakisubukan muli.' : error.message}</div>`;
        messagesContainer.appendChild(errDiv);
      } finally {
        isGenerating = false;
        sendBtn.disabled = false;
        promptInput.focus();
      }
    }
    form.addEventListener('submit', handleSubmit);
    promptInput.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px'; });
    if (suggestions) {
      suggestions.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (btn && btn.dataset.prompt) { promptInput.value = btn.dataset.prompt; promptInput.focus(); }
      });
    }
    clearBtn.addEventListener('click', () => {
      messagesContainer.innerHTML = ''; history = [];
      if (welcomeScreen) welcomeScreen.style.display = 'block';
    });
  </script>
</body>
</html>
